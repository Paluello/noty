name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        # Explicit bash enables pipefail, so a failing xcodebuild fails the step.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an iPad simulator
        id: sim
        run: |
          # The newest iOS runtime's first iPad, by id (names contain parentheses).
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r), key=lambda r: [int(x) for x in r.split("iOS-")[1].split("-")])
          ipads = [d for d in devices[runtimes[-1]] if d["name"].startswith("iPad")]
          print(ipads[0]["udid"])
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test NotyKit (data, file format, editor logic, PDF)
        working-directory: Packages/NotyKit
        run: |
          xcodebuild test -scheme NotyKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            | xcbeautify

      - name: Build the app
        run: |
          xcodebuild build -project Noty.xcodeproj -scheme Noty \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Build the AltStore variant
        run: |
          xcodebuild build -project Noty.xcodeproj -scheme Noty \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) ALTSTORE' \
            | xcbeautify
