name: Release

# Al push di un tag "v*" (es. v0.6.0 o v0.7.0-beta.1) compila l'.ipa per
# AltStore/SideStore e prepara una release in bozza con il file allegato.
# Scrivi le note nella bozza su GitHub e pubblicala: il sito
# noty.paluello.me la mostra al deploy successivo (ogni notte, o a mano).
#
#   git tag -a v0.6.0 -m "Noty 0.6" && git push origin v0.6.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # Build non firmata: AltStore e SideStore la firmano con l'Apple ID di chi installa.
      # ALTSTORE attiva il link "Sostieni Noty" nelle Impostazioni.
      - name: Archive
        run: |
          xcodebuild archive \
            -project Noty.xcodeproj -scheme Noty -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Noty.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) ALTSTORE' \
            | xcbeautify

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/Noty.xcarchive/Products/Applications/Noty.app build/Payload/
          (cd build && zip -qry Noty.ipa Payload)
          ls -lh build/Noty.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noty-ipa
          path: build/Noty.ipa

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: build/Noty.ipa
          generate_release_notes: true
